services:
  # Next.js Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/web/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

  # Laravel API
  api:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
    environment:
      - APP_NAME=Momoki
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=momoki
      - DB_USERNAME=momoki
      - DB_PASSWORD=secret
      - SESSION_DRIVER=cookie
      - SESSION_SECURE_COOKIE=false
      - SANCTUM_STATEFUL_DOMAINS=localhost:3000
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_DB=momoki
      - POSTGRES_USER=momoki
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momoki -d momoki"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  api_vendor:
  web_node_modules:
  web_next:
